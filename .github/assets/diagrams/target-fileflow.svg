<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
<title id="title">Planned FileFlow application slice</title><desc id="desc">A browser accesses a Go application on EKS. The application image comes from ECR and files are stored in S3 using workload identity.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071426"/><stop offset="1" stop-color="#123B52"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000" flood-opacity=".22"/></filter><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#8EC5DA"/></marker><marker id="orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#FF9900"/></marker></defs>
<rect width="1440" height="720" rx="28" fill="url(#bg)"/><text x="70" y="70" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial" font-size="34" font-weight="750">Target application slice</text><text x="70" y="106" fill="#AFC9D8" font-family="Arial" font-size="18">Planned next: one Go image serving a visual web interface and a file API.</text><rect x="1190" y="45" width="170" height="42" rx="21" fill="#FF9900"/><text x="1275" y="72" text-anchor="middle" fill="#172B3A" font-family="Arial" font-size="14" font-weight="700">PLANNED</text>
<g filter="url(#shadow)"><rect x="70" y="270" width="220" height="150" rx="22" fill="#F8FBFD"/><circle cx="180" cy="320" r="30" fill="#326CE5"/><path d="M164 320h32M180 304v32" stroke="white" stroke-width="4" stroke-linecap="round"/><text x="180" y="376" text-anchor="middle" fill="#243B53" font-family="Arial" font-size="20" font-weight="700">Browser</text><text x="180" y="401" text-anchor="middle" fill="#627D98" font-family="Arial" font-size="13">Upload · list · download</text></g>
<rect x="390" y="165" width="620" height="450" rx="26" fill="#F1F8F5" stroke="#61BD91" stroke-width="2" stroke-dasharray="9 7"/><image href="data:image/svg+xml;base64," x="420" y="190" width="54" height="54"/><text x="492" y="223" fill="#24543E" font-family="Arial" font-size="20" font-weight="700">VPC private subnets</text>
<g filter="url(#shadow)"><rect x="450" y="280" width="500" height="250" rx="24" fill="white"/><image href="data:image/svg+xml;base64," x="480" y="305" width="64" height="64"/><text x="565" y="340" fill="#243B53" font-family="Arial" font-size="21" font-weight="700">Amazon EKS</text><rect x="500" y="395" width="400" height="100" rx="18" fill="#E8F8FB" stroke="#56B7C9"/><circle cx="555" cy="445" r="30" fill="#00ADD8"/><text x="555" y="453" text-anchor="middle" fill="white" font-family="Arial" font-size="18" font-weight="800">GO</text><text x="610" y="437" fill="#243B53" font-family="Arial" font-size="18" font-weight="700">FileFlow</text><text x="610" y="462" fill="#627D98" font-family="Arial" font-size="13">API + embedded web UI · one pod</text></g>
<path d="M290 345H450" stroke="#8EC5DA" stroke-width="3" marker-end="url(#arr)"/><text x="370" y="328" text-anchor="middle" fill="#AFC9D8" font-family="Arial" font-size="12" font-weight="700">HTTP</text>
<g filter="url(#shadow)"><rect x="1080" y="175" width="280" height="150" rx="22" fill="#F8FBFD"/><image href="data:image/svg+xml;base64," x="1110" y="202" width="64" height="64"/><text x="1192" y="232" fill="#243B53" font-family="Arial" font-size="18" font-weight="700">Amazon ECR</text><text x="1192" y="258" fill="#627D98" font-family="Arial" font-size="13">FileFlow image</text><text x="1220" y="298" text-anchor="middle" fill="#8A5A14" font-family="Arial" font-size="12">built and published by CI</text></g>
<path d="M1080 275H970V410" fill="none" stroke="#FF9900" stroke-width="3" marker-end="url(#orange)"/><text x="1025" y="260" text-anchor="middle" fill="#FFB84D" font-family="Arial" font-size="12" font-weight="700">DEPLOY</text>
<g filter="url(#shadow)"><rect x="1080" y="400" width="280" height="150" rx="22" fill="#F8FBFD"/><image href="data:image/svg+xml;base64," x="1110" y="426" width="64" height="64"/><text x="1192" y="458" fill="#243B53" font-family="Arial" font-size="18" font-weight="700">Amazon S3</text><text x="1192" y="484" fill="#627D98" font-family="Arial" font-size="13">File objects</text><text x="1220" y="523" text-anchor="middle" fill="#526D82" font-family="Arial" font-size="12">access via workload identity</text></g>
<path d="M950 450H1080" stroke="#8EC5DA" stroke-width="3" marker-end="url(#arr)"/><text x="1015" y="434" text-anchor="middle" fill="#AFC9D8" font-family="Arial" font-size="12" font-weight="700">AWS SDK</text>
<g transform="translate(70 565)"><rect width="870" height="90" rx="18" fill="#102F46" stroke="#35647D"/><text x="28" y="36" fill="#FFB84D" font-family="Arial" font-size="13" font-weight="700">WHY ONE IMAGE FIRST?</text><text x="28" y="65" fill="#C5D9E5" font-family="Arial" font-size="14">A Go binary can embed the initial UI, keeping the first deployment small. The frontend can become a separate image later.</text></g>
</svg>